# The tests on every push and pull request. Offline: the server talks to a fake API in them.
# This repository is a copy of integrations/mcp in SanAlert's own repository, refreshed with each release.
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run --locked --python 3.13 pytest -q
